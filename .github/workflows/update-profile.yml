name: Update Profile Stats

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  update-profile:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Generate profile stats
        run: npx tsx scripts/generate-github-stats.ts
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}

      - name: Commit generated assets
        run: |
          git config user.name "profile-stats-bot"
          git config user.email "profile-stats-bot@users.noreply.github.com"
          git add -A assets/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update github impact stats [skip ci]"
          git push || true
